<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Detection</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>FACE ATTENDANCE SYSTEM</h1>
    <nav>
      <a href="/register" class="nav-link">Register Face</a>
    </nav>
  </header>

  <main class="container">
    <div class="video-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
      <button id="startBtn">START</button>
      <button id="stopBtn" disabled>STOP</button>
      <label>
        <input type="range" id="confSlider" min="10" max="80" value="30" /> 
        <span id="confLabel">Confidence: 30%</span>
      </label>
    </div>

    <div id="status" class="status">Ready to detect faces</div>

    <div class="attendance-panel">
      <h2>Recent Attendance</h2>
      <div id="attendanceLog" class="attendance-log">
        <div class="log-entry">Waiting for data...</div>
      </div>
    </div>
  </main>

  <script src="/script.js"></script>
</body>
</html>
