<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Absensi Wajah</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Sistem Absensi Wajah</h1>
    <nav>
      <a href="/" class="active">Beranda</a>
      <a href="/register">Daftar Wajah</a>
      <a href="/users">Daftar User</a>
    </nav>
  </header>

  <main class="container">
    <div class="page-header">
      <h2>Pengenalan Wajah</h2>
      <p>Arahkan wajah Anda ke kamera untuk melakukan absensi</p>
    </div>

    <div class="video-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
      <button id="startBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Mulai Kamera
      </button>
      <button id="captureBtn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="4"></circle>
        </svg>
        Capture & Kenali
      </button>
      <button id="stopBtn" class="secondary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="6" y="6" width="12" height="12" rx="2"></rect>
        </svg>
        Berhenti
      </button>
      <label>
        <input type="checkbox" id="hiAcc" /> 
        <span>Akurasi Tinggi (CNN)</span>
      </label>
    </div>

    <div id="status" class="status">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      Siap untuk mengenali wajah
    </div>
  </main>

  <script src="/script.js"></script>
</body>
</html>
