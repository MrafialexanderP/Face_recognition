<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hasil Pengenalan - Sistem Absensi Wajah</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
  <style>
    .result-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    
    .result-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      box-shadow: var(--shadow-xl);
      text-align: center;
      animation: slideUp 0.5s ease-out;
      border: 1px solid var(--border-color);
    }
    
    @keyframes slideUp {
      from { 
        opacity: 0; 
        transform: translateY(24px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    .success-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--accent-color), #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: scaleIn 0.5s ease-out;
    }
    
    .success-icon svg {
      color: white;
      width: 36px;
      height: 36px;
    }
    
    @keyframes scaleIn {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .result-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .result-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    
    .result-photo-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
    }
    
    .result-photo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary-color);
      box-shadow: 0 8px 24px rgba(0, 102, 255, 0.25);
      transition: all 0.3s ease;
    }
    
    .result-photo:hover {
      transform: scale(1.03);
    }
    
    .photo-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: var(--accent-color);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
      border: 3px solid white;
    }
    
    .photo-badge svg {
      width: 18px;
      height: 18px;
    }
    
    .result-info {
      margin: 24px 0;
      background: var(--bg-light);
      border-radius: var(--radius-lg);
      padding: 8px;
      border: 1px solid var(--border-color);
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      transition: all 0.2s ease;
      border-radius: var(--radius-md);
    }
    
    .info-row:hover {
      background: var(--bg-card);
    }
    
    .info-label {
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .info-label svg {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }
    
    .info-value {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 14px;
    }
    
    .confidence-section {
      margin: 24px 0;
      padding: 24px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 24px rgba(0, 102, 255, 0.25);
    }
    
    .confidence-label {
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .confidence-value {
      color: white;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    
    .confidence-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: 16px;
    }
    
    .confidence-fill {
      height: 100%;
      background: white;
      border-radius: var(--radius-full);
      transition: width 1s ease-out;
    }
    
    .action-buttons {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .action-buttons button {
      min-width: 160px;
    }
    
    @media (max-width: 768px) {
      .result-container {
        padding: 24px 16px;
      }
      
      .result-card {
        padding: 32px 24px;
      }
      
      .result-title {
        font-size: 20px;
      }
      
      .result-photo {
        width: 140px;
        height: 140px;
      }
      
      .info-row {
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
      
      .confidence-value {
        font-size: 32px;
      }
      
      .action-buttons {
        flex-direction: column;
      }
      
      .action-buttons button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Hasil Pengenalan</h1>
    <nav>
      <a href="/">Beranda</a>
      <a href="/register">Daftar Wajah</a>
      <a href="/users">Daftar User</a>
    </nav>
  </header>

  <main class="result-container">
    <div class="result-card" id="resultCard">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      
      <h2 class="result-title">Wajah Berhasil Dikenali</h2>
      <p class="result-subtitle">Data berhasil diverifikasi dengan sistem</p>
      
      <div class="result-photo-wrapper">
        <img id="userPhoto" class="result-photo" src="" alt="Foto User">
        <div class="photo-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>
      
      <div class="result-info">
        <div class="info-row">
          <span class="info-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Nama Lengkap
          </span>
          <span class="info-value" id="userName">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            NIM
          </span>
          <span class="info-value" id="userNim">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            Jenis Kelamin
          </span>
          <span class="info-value" id="userGender">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Usia
          </span>
          <span class="info-value" id="userAge">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Waktu Absensi
          </span>
          <span class="info-value" id="timestamp">-</span>
        </div>
      </div>
      
      <div class="confidence-section">
        <div class="confidence-label">Tingkat Akurasi</div>
        <div class="confidence-value" id="confidenceValue">0%</div>
        <div class="confidence-bar">
          <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
        </div>
      </div>
      
      <div class="action-buttons">
        <button onclick="window.location.href='/'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          Kenali Lagi
        </button>
        <button class="secondary" onclick="window.location.href='/users'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Lihat Semua User
        </button>
      </div>
    
    </div>
  </main>

  <script>
    (function(){
      const userData = sessionStorage.getItem('recognizedUser');
      const capturedImage = sessionStorage.getItem('capturedImage');
      
      if (!userData) {
        alert('Tidak ada data pengenalan. Silakan capture wajah terlebih dahulu.');
        window.location.href = '/';
        return;
      }
      
      try {
        const user = JSON.parse(userData);
        
        document.getElementById('userName').textContent = user.name || '-';
        document.getElementById('userNim').textContent = user.nim || '-';
        document.getElementById('userGender').textContent = user.gender || '-';
        document.getElementById('userAge').textContent = user.age ? `${user.age} tahun` : '-';
        
        const confidence = user.confidence || 0;
        const confidenceValueEl = document.getElementById('confidenceValue');
        const confidenceFillEl = document.getElementById('confidenceFill');
        
        let current = 0;
        const target = parseFloat(confidence);
        const increment = target / 50;
        const timer = setInterval(() => {
          current += increment;
          if (current >= target) {
            current = target;
            clearInterval(timer);
          }
          confidenceValueEl.textContent = current.toFixed(2) + '%';
        }, 20);
        
        setTimeout(() => {
          confidenceFillEl.style.width = confidence + '%';
        }, 100);
        
        const photoEl = document.getElementById('userPhoto');
        if (capturedImage) {
          photoEl.src = capturedImage;
        } else if (user.photo) {
          photoEl.src = 'data:image/jpeg;base64,' + user.photo;
        } else {
          const initial = user.name ? user.name[0].toUpperCase() : '?';
          photoEl.src = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%230066FF'/%3E%3Ctext x='50' y='50' text-anchor='middle' dy='.35em' fill='white' font-size='40' font-weight='bold'%3E${initial}%3C/text%3E%3C/svg%3E`;
        }
        
        const now = new Date();
        const timeString = now.toLocaleString('id-ID', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        document.getElementById('timestamp').innerHTML = timeString;
        
      } catch(err) {
        console.error('Error parsing user data:', err);
        alert('Terjadi kesalahan saat memproses data. Silakan coba lagi.');
        window.location.href = '/';
      }
    })();
  </script>
</body>
</html>
