<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendaftaran Wajah - Face Recognition</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>REGISTER NEW FACE</h1>
    <nav>
      <a href="/" class="nav-link">Back to Home</a>
    </nav>
  </header>

  <main class="container">
    <div class="form-group">
      <label for="nameInput">Full Name:</label>
      <input type="text" id="nameInput" placeholder="Enter your name" />
    </div>

    <div class="video-wrapper">
      <video id="regVideo" autoplay playsinline muted></video>
      <canvas id="snapshot" class="hidden"></canvas>
    </div>

    <div class="controls">
      <button id="startRegBtn">START CAMERA</button>
      <button id="registerBtn" disabled>CAPTURE & REGISTER</button>
    </div>

    <div id="regStatus" class="status">Ready to register new face</div>
  </main>

  <script src="/register.js"></script>
</body>
</html>
