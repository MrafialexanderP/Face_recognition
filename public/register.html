<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendaftaran Wajah - Face Recognition</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
  <style>
    .form-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      margin-bottom: 32px;
    }
    
    .form-card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .form-card-title svg {
      color: var(--primary-color);
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
    }
    
    .form-group label .required {
      color: var(--danger-color);
      margin-left: 2px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    select, input[type="number"] {
      padding: 14px 18px;
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-family: inherit;
      background: var(--bg-card);
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      color: var(--text-primary);
      cursor: pointer;
    }
    
    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
    }
    
    input[type="number"] {
      cursor: text;
    }
    
    .input-hint {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    
    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .form-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Pendaftaran Wajah</h1>
    <nav>
      <a href="/">Beranda</a>
      <a href="/register" class="active">Daftar Wajah</a>
      <a href="/users">Daftar User</a>
    </nav>
  </header>

  <main class="container">
    <div class="page-header">
      <h2>Daftarkan Wajah Baru</h2>
      <p>Lengkapi data diri dan ambil foto wajah untuk pendaftaran</p>
    </div>

    <div class="form-card">
      <div class="form-card-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Data Pribadi
      </div>
      
      <div class="form-group">
        <label for="nameInput">Nama Lengkap <span class="required">*</span></label>
        <input type="text" id="nameInput" placeholder="Masukkan nama lengkap Anda" />
      </div>
      
      <div class="form-group">
        <label for="nimInput">NIM (Nomor Induk Mahasiswa) <span class="required">*</span></label>
        <input type="text" id="nimInput" placeholder="Masukkan NIM Anda" />
        <div class="input-hint">Contoh: 2021001234</div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="genderInput">Jenis Kelamin</label>
          <select id="genderInput">
            <option value="">Pilih jenis kelamin</option>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="ageInput">Usia</label>
          <input type="number" id="ageInput" placeholder="Masukkan usia" min="1" max="150" />
        </div>
      </div>
    </div>

    <div class="video-wrapper">
      <video id="regVideo" autoplay playsinline muted></video>
      <canvas id="snapshot" class="hidden"></canvas>
    </div>

    <div class="controls">
      <button id="startRegBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Mulai Kamera
      </button>
      <button id="registerBtn" class="success" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        Ambil & Daftar
      </button>
      <label>
        <input type="checkbox" id="hiAccReg" /> 
        <span>Akurasi Tinggi (CNN)</span>
      </label>
    </div>

    <div id="regStatus" class="status">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      Siap untuk mendaftarkan wajah baru
    </div>
  </main>

  <script src="/register.js"></script>
</body>
</html>
